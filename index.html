<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fast search and lookup for Microsoft Dynamics 365 Business Central tables and fields.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="src/styles/style.css" />
    <title>BC Table & Fields Finder</title>
  </head>
  <body>
    <header>
      <h1>BC Table & Fields Finder</h1>
    </header>
    <main class="container">
      <section class="search-section">
          <div class="search-container">
              <input id="tableId" type="text" placeholder="Search Table (ID or Name)..." aria-label="Search Business Central Tables" autocomplete="off" />
              <button id="searchBtn" aria-label="Search"><i class="fas fa-search"></i></button>
          </div>
          <div id="suggestionList" class="suggestion-list"></div>
      </section>
      
      <section id="resultsContainer" class="results-container">
          <div class="placeholder-text">
              <p>Start typing to search for tables...</p>
          </div>
      </section>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
